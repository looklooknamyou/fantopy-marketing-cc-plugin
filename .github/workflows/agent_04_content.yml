name: Agent 04 — Content Writer

on:
  schedule:
    - cron: "0 7 * * 3"   # Every Wednesday at 07:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Content Writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECRUITER_SHEET_ID: ${{ secrets.RECRUITER_SHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: /tmp/gsa.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo '${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}' > /tmp/gsa.json
          python agents/agent_04_content_writer.py
