<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>marketing-pipeline</title>
  <style>
    :root {
      --background-primary: #1e1e1e;
      --background-primary-alt: #252526;
      --background-secondary: #1e1e1e;
      --background-secondary-alt: #2a2d2e;
      --background-modifier-hover: rgba(255, 255, 255, 0.05);
      --background-modifier-active-hover: rgba(255, 255, 255, 0.08);
      --background-modifier-border: rgba(255, 255, 255, 0.1);
      --background-modifier-form-field: #1e1e1e;
      --text-normal: #dcddde;
      --text-muted: #999999;
      --text-faint: #666666;
      --text-on-accent: #ffffff;
      --text-accent: #7f6df2;
      --text-accent-hover: #8b7cf7;
      --interactive-accent: #7f6df2;
      --interactive-accent-hover: #8b7cf7;
      --interactive-success: #269945;
      --text-error: #ee3824;
      --text-warning: #e0a030;
      --text-success: #269945;
      --divider-color: rgba(255, 255, 255, 0.1);
      --nav-item-color: #999999;
      --nav-item-color-hover: #dcddde;
      --nav-item-color-active: #dcddde;
      --nav-item-background-hover: rgba(255, 255, 255, 0.04);
      --nav-item-background-active: rgba(255, 255, 255, 0.08);
      --tag-color: #7f6df2;
      --tag-background: rgba(127, 109, 242, 0.15);
      --radius-s: 4px;
      --radius-m: 8px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      --font-mono: Menlo, Monaco, Consolas, "Courier New", monospace;
      --sidebar-width: 240px;
      --header-height: 40px;
      --status-bar-height: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--background-primary);
      color: var(--text-normal);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--interactive-accent); }

    /* ===================== WORKSPACE LAYOUT ===================== */
    .workspace { display: flex; width: 100%; height: 100vh; }

    /* Left Sidebar */
    .workspace-sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--background-secondary);
      border-right: 1px solid var(--divider-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider-color);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-normal);
      letter-spacing: 0.02em;
    }
    .sidebar-section {
      padding: 8px 0;
      border-bottom: 1px solid var(--divider-color);
    }
    .sidebar-section-header {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px 5px 24px;
      font-size: 13px;
      color: var(--nav-item-color);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--font-ui);
    }
    .sidebar-nav-item:hover {
      background: var(--nav-item-background-hover);
      color: var(--nav-item-color-hover);
    }
    .sidebar-nav-item.active {
      background: var(--nav-item-background-active);
      color: var(--nav-item-color-active);
    }
    .sidebar-nav-icon { font-size: 14px; opacity: 0.7; }
    .sidebar-campaign-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 16px 4px 32px;
      font-size: 12px;
      color: var(--nav-item-color);
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--font-ui);
    }
    .sidebar-campaign-item:hover { background: var(--nav-item-background-hover); }
    .sidebar-campaign-item.active { background: var(--nav-item-background-active); color: var(--nav-item-color-active); }
    .sidebar-campaign-dot {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0;
    }
    .sidebar-campaign-dot.active { background: var(--interactive-success); }
    .sidebar-campaign-dot.paused { background: var(--text-warning); }
    .sidebar-campaign-dot.completed { background: var(--text-muted); }
    .sidebar-create-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px 6px 24px;
      font-size: 12px;
      color: var(--text-accent);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--font-ui);
      transition: background 0.15s;
    }
    .sidebar-create-btn:hover { background: var(--nav-item-background-hover); }
    .sidebar-empty {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-faint);
    }

    /* Main Area */
    .workspace-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tab Bar */
    .workspace-tab-bar {
      display: flex;
      align-items: center;
      height: var(--header-height);
      background: var(--background-primary);
      border-bottom: 1px solid var(--divider-color);
      padding: 0 8px;
      gap: 2px;
    }
    .workspace-tab {
      padding: 6px 16px;
      font-size: 13px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-s) var(--radius-s) 0 0;
      cursor: pointer;
      font-family: var(--font-ui);
      transition: background 0.15s, color 0.15s;
    }
    .workspace-tab:hover { color: var(--text-normal); }
    .workspace-tab.active {
      background: var(--background-secondary-alt);
      color: var(--text-normal);
    }

    /* Content Area */
    .workspace-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: var(--background-primary);
    }

    /* Status Bar */
    .workspace-status-bar {
      height: var(--status-bar-height);
      background: var(--background-primary);
      border-top: 1px solid var(--divider-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .status-bar-left { display: flex; align-items: center; gap: 12px; }
    .status-bar-right { display: flex; align-items: center; gap: 12px; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--interactive-success);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ===================== CAMPAIGN HUB ===================== */
    .hub-view { animation: fade-in 0.3s ease-out; }
    .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .hub-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-normal);
    }
    .hub-create-btn {
      background: var(--interactive-accent);
      border: none;
      color: var(--text-on-accent);
      padding: 6px 16px;
      border-radius: var(--radius-s);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .hub-create-btn:hover { background: var(--interactive-accent-hover); }
    .hub-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .hub-card {
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-m);
      padding: 16px;
      transition: background 0.15s;
      cursor: default;
    }
    .hub-card:hover { background: var(--background-secondary-alt); }
    .hub-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .hub-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-normal);
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 360px;
    }
    .hub-card-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .hub-card-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-s);
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }
    .hub-card-status.active { background: rgba(38,153,69,0.2); color: var(--text-success); }
    .hub-card-status.paused { background: rgba(224,160,48,0.2); color: var(--text-warning); }
    .hub-card-status.completed { background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .hub-card-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .hub-card-bar-wrap {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .hub-card-bar-fill {
      height: 100%;
      background: var(--interactive-accent);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .hub-card-pct { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .hub-card-batch { font-size: 12px; color: var(--text-faint); }
    .hub-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--divider-color);
      font-size: 12px;
      color: var(--text-faint);
    }
    .hub-card-last-result.success { color: var(--text-success); font-weight: 500; }
    .hub-card-last-result.failed { color: var(--text-error); font-weight: 500; }
    .hub-card-actions { display: flex; gap: 6px; }
    .hub-action-btn {
      background: transparent;
      border: 1px solid var(--background-modifier-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-s);
      font-family: var(--font-ui);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hub-action-btn:hover {
      background: var(--background-modifier-hover);
      color: var(--text-normal);
    }
    .hub-action-btn.run:hover {
      border-color: var(--interactive-accent);
      color: var(--text-accent);
    }
    .hub-action-btn.danger:hover {
      border-color: var(--text-error);
      color: var(--text-error);
    }
    .hub-card-empty {
      color: var(--text-muted);
      font-size: 14px;
      padding: 60px 20px;
      text-align: center;
    }
    .hub-card-empty p:last-child { color: var(--text-faint); font-size: 12px; margin-top: 8px; }

    /* ===================== WIZARD VIEW ===================== */
    .wizard-view { animation: fade-in 0.3s ease-out; max-width: 600px; margin: 0 auto; }
    .wizard-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .wizard-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-normal);
    }
    .wizard-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .wizard-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .wizard-step {
      width: 60px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .wizard-step.active { background: var(--interactive-accent); }
    .wizard-step.done { background: var(--interactive-success); }
    .wizard-content {
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-m);
      padding: 24px;
      margin-bottom: 24px;
      animation: slide-in 0.2s ease-out;
    }
    @keyframes slide-in {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .wizard-step-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-normal);
      margin-bottom: 16px;
    }
    .wizard-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .wizard-hint {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 8px;
    }
    .wizard-textarea {
      width: 100%;
      min-height: 120px;
      background: var(--background-modifier-form-field);
      border: 1px solid var(--background-modifier-border);
      color: var(--text-normal);
      padding: 10px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      border-radius: var(--radius-s);
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .wizard-textarea:focus {
      outline: none;
      border-color: var(--interactive-accent);
      box-shadow: 0 0 0 2px rgba(127,109,242,0.2);
    }
    .wizard-textarea::placeholder { color: var(--text-faint); }
    .wizard-checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .wizard-checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text-normal);
    }
    .wizard-checkbox {
      width: 16px;
      height: 16px;
      background: var(--background-modifier-form-field);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .wizard-checkbox.checked {
      background: var(--interactive-accent);
      border-color: var(--interactive-accent);
    }
    .wizard-checkbox.checked::after {
      content: '\2713';
      position: absolute;
      color: var(--text-on-accent);
      font-size: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .wizard-radio-group {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .wizard-radio {
      padding: 8px 16px;
      border: 1px solid var(--background-modifier-border);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-s);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-ui);
    }
    .wizard-radio:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text-normal);
    }
    .wizard-radio.active {
      border-color: var(--interactive-accent);
      background: rgba(127,109,242,0.1);
      color: var(--text-accent);
    }
    .wizard-input {
      background: var(--background-modifier-form-field);
      border: 1px solid var(--background-modifier-border);
      color: var(--text-normal);
      padding: 8px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      width: 100%;
      border-radius: var(--radius-s);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .wizard-input:focus {
      outline: none;
      border-color: var(--interactive-accent);
      box-shadow: 0 0 0 2px rgba(127,109,242,0.2);
    }
    .wizard-day-buttons {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }
    .wizard-day-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--background-modifier-border);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-s);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-ui);
    }
    .wizard-day-btn:hover { border-color: rgba(255,255,255,0.2); }
    .wizard-day-btn.active {
      border-color: var(--interactive-accent);
      background: rgba(127,109,242,0.1);
      color: var(--text-accent);
    }
    .wizard-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--divider-color);
      margin-top: 16px;
    }
    .wizard-btn {
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-s);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-ui);
    }
    .wizard-btn-back {
      background: transparent;
      border: 1px solid var(--background-modifier-border);
      color: var(--text-muted);
    }
    .wizard-btn-back:hover { color: var(--text-normal); border-color: rgba(255,255,255,0.2); }
    .wizard-btn-next {
      background: var(--interactive-accent);
      border: 1px solid var(--interactive-accent);
      color: var(--text-on-accent);
    }
    .wizard-btn-next:hover { background: var(--interactive-accent-hover); }
    .wizard-command-box {
      background: var(--background-primary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-m);
      padding: 16px;
      margin-bottom: 16px;
    }
    .wizard-command {
      background: rgba(0,0,0,0.3);
      color: var(--text-accent);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 12px;
      border-radius: var(--radius-s);
    }
    .wizard-copy-btn {
      background: var(--interactive-accent);
      border: none;
      color: var(--text-on-accent);
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-s);
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
      font-family: var(--font-ui);
    }
    .wizard-copy-btn:hover { background: var(--interactive-accent-hover); }
    .wizard-copied { background: var(--interactive-success); }

    /* ===================== CALENDAR VIEW ===================== */
    .calendar-view { animation: fade-in 0.3s ease-out; }
    .calendar-funnel-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
    }
    .calendar-funnel-segment {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: var(--radius-s);
    }
    .calendar-funnel-segment.awareness { background: rgba(127,109,242,0.15); color: var(--text-accent); }
    .calendar-funnel-segment.consideration { background: rgba(38,153,69,0.15); color: var(--text-success); }
    .calendar-funnel-segment.decision { background: rgba(224,160,48,0.15); color: var(--text-warning); }
    .calendar-funnel-segment.retention { background: rgba(224,160,48,0.1); color: #b8880a; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }
    .calendar-card {
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-m);
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .calendar-card:hover { background: var(--background-secondary-alt); }
    .calendar-card.completed { border-left: 3px solid var(--interactive-success); }
    .calendar-card.running { border-left: 3px solid var(--interactive-accent); }
    .calendar-card-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .calendar-tag {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-s);
    }
    .calendar-tag.funnel-awareness { background: rgba(127,109,242,0.15); color: var(--text-accent); }
    .calendar-tag.funnel-consideration { background: rgba(38,153,69,0.15); color: var(--text-success); }
    .calendar-tag.funnel-decision { background: rgba(224,160,48,0.15); color: var(--text-warning); }
    .calendar-tag.funnel-retention { background: rgba(224,160,48,0.1); color: #b8880a; }
    .calendar-tag.pillar {
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }
    .calendar-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .calendar-card-batch {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .calendar-card-status {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-faint);
    }
    .calendar-card-status.completed { background: var(--interactive-success); }
    .calendar-card-status.running { background: var(--interactive-accent); }
    .calendar-card-theme {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-normal);
      margin-bottom: 4px;
    }
    .calendar-card-date {
      font-size: 12px;
      color: var(--text-faint);
    }
    .calendar-card-expand {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--divider-color);
      font-size: 11px;
      color: var(--text-faint);
    }

    /* ===================== BATCH DETAIL PANEL ===================== */
    .batch-detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 480px;
      max-width: 90vw;
      height: 100vh;
      background: var(--background-primary-alt);
      border-left: 1px solid var(--divider-color);
      box-shadow: -2px 0 12px rgba(0,0,0,0.3);
      transform: translateX(100%);
      transition: transform 0.25s ease-out;
      overflow-y: auto;
      z-index: 1000;
    }
    .batch-detail-panel.open { transform: translateX(0); }
    .batch-detail-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 999;
    }
    .batch-detail-overlay.open { opacity: 1; pointer-events: auto; }
    .batch-detail-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--divider-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .batch-detail-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-normal);
    }
    .batch-detail-close {
      width: 28px; height: 28px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      border-radius: var(--radius-s);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .batch-detail-close:hover { background: var(--background-modifier-hover); color: var(--text-error); }
    .batch-detail-content { padding: 20px; }
    .batch-detail-section { margin-bottom: 20px; }
    .batch-detail-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .batch-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .batch-detail-item {
      padding: 10px;
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-s);
    }
    .batch-detail-label {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    .batch-detail-value {
      font-size: 13px;
      color: var(--text-normal);
    }
    .batch-detail-content-card {
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-s);
      padding: 12px;
      margin-bottom: 8px;
    }
    .batch-detail-content-type {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-accent);
      margin-bottom: 8px;
    }
    .batch-detail-content-detail {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .batch-detail-content-detail strong { color: var(--text-normal); }

    /* ===================== HISTORY VIEW ===================== */
    .history-view { animation: fade-in 0.3s ease-out; }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .history-table th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--divider-color);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .history-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .history-table tr { cursor: pointer; transition: background 0.15s; }
    .history-table tr:hover { background: var(--background-modifier-hover); }
    .history-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-s);
      font-size: 11px;
      font-weight: 500;
    }
    .history-status.success { background: rgba(38,153,69,0.15); color: var(--text-success); }
    .history-status.failed { background: rgba(238,56,36,0.15); color: var(--text-error); }
    .history-status.running { background: rgba(127,109,242,0.15); color: var(--text-accent); }
    .history-status.pending { background: rgba(255,255,255,0.06); color: var(--text-faint); }

    /* ===================== COMMAND TOAST ===================== */
    .command-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--background-primary-alt);
      border: 1px solid var(--background-modifier-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border-radius: var(--radius-m);
      padding: 16px 20px;
      z-index: 2000;
      transition: transform 0.25s ease-out;
      max-width: 560px;
      width: 90vw;
    }
    .command-toast.show { transform: translateX(-50%) translateY(0); }
    .command-toast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .command-toast-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-normal);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .command-toast-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }
    .command-toast-close:hover { color: var(--text-error); }
    .command-toast-body {
      background: rgba(0,0,0,0.2);
      padding: 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-s);
    }
    .command-toast-command {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-accent);
      word-break: break-all;
    }
    .command-toast-actions { display: flex; gap: 8px; }
    .command-toast-btn {
      background: var(--interactive-accent);
      border: none;
      color: var(--text-on-accent);
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-s);
      cursor: pointer;
      font-family: var(--font-ui);
      transition: background 0.15s;
    }
    .command-toast-btn:hover { background: var(--interactive-accent-hover); }
    .command-toast-copied { background: var(--interactive-success); }

    /* ===================== MONITOR VIEW ===================== */
    .sustain-panel-view { animation: fade-in 0.3s ease-out; }
    .sustain-header { margin-bottom: 20px; }
    .sustain-title { font-size: 20px; font-weight: 700; color: var(--text-normal); }
    .sustain-sections { display: flex; flex-direction: column; gap: 12px; }
    .sustain-section {
      background: var(--background-secondary);
      border: 1px solid var(--background-modifier-border);
      border-radius: var(--radius-m);
      padding: 16px;
    }
    .sustain-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .sustain-status, .sustain-progress, .sustain-next-run {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-normal);
    }

    /* ===================== ANIMATIONS ===================== */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <!-- Sidebar -->
    <div class="workspace-sidebar" id="workspace-sidebar"></div>

    <!-- Main Area -->
    <div class="workspace-main">
      <div class="workspace-tab-bar" id="workspace-tab-bar"></div>
      <div class="workspace-content" id="dashboard"></div>
      <div class="workspace-status-bar">
        <div class="status-bar-left">
          <span id="status-view">Hub</span>
        </div>
        <div class="status-bar-right">
          <span class="status-dot" id="status-dot" style="display:none"></span>
          <span id="status-refresh"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Command Toast -->
  <div id="command-toast" class="command-toast">
    <div class="command-toast-header">
      <span class="command-toast-title" id="toast-title">Command</span>
      <button class="command-toast-close" onclick="hideToast()">&times;</button>
    </div>
    <div class="command-toast-body">
      <div class="command-toast-command" id="toast-command"></div>
    </div>
    <div class="command-toast-actions">
      <button class="command-toast-btn" id="toast-btn" onclick="copyCommand()">Copy</button>
    </div>
  </div>

  <!-- Batch Detail Panel -->
  <div id="batch-detail-overlay" class="batch-detail-overlay" onclick="closeBatchDetail()"></div>
  <div id="batch-detail-panel" class="batch-detail-panel">
    <div class="batch-detail-header">
      <span class="batch-detail-title" id="detail-title">Batch Details</span>
      <button class="batch-detail-close" onclick="closeBatchDetail()">&times;</button>
    </div>
    <div class="batch-detail-content" id="detail-content"></div>
  </div>

  <script>
    // ===================== STATE =====================
    let currentView = null;
    let currentCampaign = null;
    let sidebarCampaigns = [];
    let wizardState = {
      step: 1,
      brief: '',
      contentTypes: ['blog-post', 'social-media'],
      platforms: ['twitter'],
      cadence: 'weekly',
      day: 1,
      hour: 9,
      totalBatches: 12
    };

    // ===================== URL HELPERS =====================
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        view: params.get('view'),
        sustain: params.get('sustain'),
        campaign_dir: params.get('campaign_dir'),
        cloud: params.get('cloud'),
        campaign_id: params.get('campaign_id'),
        supabase_url: params.get('supabase_url'),
        supabase_key: params.get('supabase_key')
      };
    }

    function setUrlParam(key, value) {
      const url = new URL(window.location);
      if (value === null || value === undefined) {
        url.searchParams.delete(key);
      } else {
        url.searchParams.set(key, value);
      }
      history.replaceState({}, '', url);
    }

    // ===================== SIDEBAR =====================
    function renderSidebar() {
      const sidebar = document.getElementById('workspace-sidebar');
      sidebar.innerHTML = `
        <div class="sidebar-header">marketing-pipeline</div>
        <div class="sidebar-section">
          <div class="sidebar-section-header">Navigation</div>
          <button class="sidebar-nav-item" data-nav="hub" onclick="switchView('hub')">
            <span class="sidebar-nav-icon">\u2302</span> Campaigns
          </button>
          <button class="sidebar-nav-item" data-nav="wizard" onclick="switchView('wizard')">
            <span class="sidebar-nav-icon">+</span> New Campaign
          </button>
          <button class="sidebar-nav-item" data-nav="monitor" onclick="switchView('monitor', '${currentCampaign || ''}')">
            <span class="sidebar-nav-icon">\u25CB</span> Monitor
          </button>
          <button class="sidebar-nav-item" data-nav="calendar" onclick="switchView('calendar', '${currentCampaign || ''}')">
            <span class="sidebar-nav-icon">\u2637</span> Calendar
          </button>
          <button class="sidebar-nav-item" data-nav="history" onclick="switchView('history', '${currentCampaign || ''}')">
            <span class="sidebar-nav-icon">\u2261</span> History
          </button>
        </div>
        <div class="sidebar-section" id="sidebar-campaigns-section">
          <div class="sidebar-section-header">Campaigns</div>
          <div id="sidebar-campaigns-list">
            <div class="sidebar-empty">No campaigns loaded</div>
          </div>
        </div>
      `;
    }

    function updateSidebarActive(viewName) {
      document.querySelectorAll('.sidebar-nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.nav === viewName);
      });
    }

    function updateSidebarCampaigns(campaigns) {
      sidebarCampaigns = campaigns;
      const list = document.getElementById('sidebar-campaigns-list');
      if (!list) return;
      if (campaigns.length === 0) {
        list.innerHTML = '<div class="sidebar-empty">No campaigns found</div>';
        return;
      }
      list.innerHTML = campaigns.map(c => `
        <button class="sidebar-campaign-item" data-slug="${c.slug}" onclick="switchView('monitor', '${c.dir}')">
          <span class="sidebar-campaign-dot ${c.status}"></span>
          ${escapeHtml(c.slug)}
        </button>
      `).join('');
    }

    // ===================== TAB BAR =====================
    function renderTabBar(activeTab) {
      const tabBar = document.getElementById('workspace-tab-bar');
      tabBar.innerHTML = ['hub', 'monitor', 'calendar', 'history'].map(tab => `
        <button class="workspace-tab ${tab === activeTab ? 'active' : ''}" onclick="switchView('${tab}', '${currentCampaign || ''}')">
          ${tab.charAt(0).toUpperCase() + tab.slice(1)}
        </button>
      `).join('');
    }

    // ===================== VIEW ROUTER =====================
    function initViewRouter() {
      const params = getUrlParams();

      renderSidebar();

      if (params.cloud === '1') {
        renderCloudView(params);
        return;
      }

      if (params.sustain === '1') {
        if (params.campaign_dir) {
          currentCampaign = params.campaign_dir;
          renderMonitorView();
        } else {
          renderHubView();
        }
        return;
      }

      if (params.view) {
        switch (params.view) {
          case 'hub': renderHubView(); break;
          case 'wizard': renderWizardView(); break;
          case 'monitor':
            currentCampaign = params.campaign_dir;
            renderMonitorView();
            break;
          case 'calendar':
            currentCampaign = params.campaign_dir;
            renderCalendarView();
            break;
          case 'history':
            currentCampaign = params.campaign_dir;
            renderHistoryView();
            break;
          default: renderOneShotView();
        }
      } else {
        renderOneShotView();
      }
    }

    function switchView(viewName, campaignDir = null) {
      if (viewName === 'one-shot') {
        setUrlParam('view', null);
        setUrlParam('sustain', null);
        setUrlParam('campaign_dir', null);
        currentCampaign = null;
        renderOneShotView();
      } else if (viewName === 'hub') {
        setUrlParam('view', 'hub');
        setUrlParam('campaign_dir', null);
        currentCampaign = null;
        renderHubView();
      } else if (viewName === 'wizard') {
        setUrlParam('view', 'wizard');
        renderWizardView();
      } else {
        setUrlParam('view', viewName);
        if (campaignDir) {
          setUrlParam('campaign_dir', campaignDir);
          currentCampaign = campaignDir;
        }
        switch (viewName) {
          case 'monitor': renderMonitorView(); break;
          case 'calendar': renderCalendarView(); break;
          case 'history': renderHistoryView(); break;
        }
      }
    }

    function setActiveTab(tabName) {
      updateSidebarActive(tabName);
      renderTabBar(tabName);
      document.getElementById('status-view').textContent = tabName.charAt(0).toUpperCase() + tabName.slice(1);
    }

    // ===================== RENDER HELPERS =====================
    function getCampaignSlug(path) {
      if (!path) return '';
      const parts = path.split('/');
      return parts[parts.length - 1];
    }

    // ===================== HUB VIEW =====================
    async function renderHubView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'hub';

      dashboard.innerHTML = `
        <div class="hub-view">
          <div class="hub-header">
            <span class="hub-title">Campaigns</span>
            <button class="hub-create-btn" onclick="switchView('wizard')">+ New Campaign</button>
          </div>
          <div class="hub-card-grid" id="hub-cards">
            <div style="color:var(--text-faint);padding:20px;">Loading campaigns...</div>
          </div>
        </div>
      `;

      setActiveTab('hub');
      document.getElementById('status-refresh').textContent = 'Auto-refresh: 15s';
      document.getElementById('status-dot').style.display = '';
      await loadCampaignsIndex();
      setInterval(loadCampaignsIndex, 15000);
    }

    async function loadCampaignsIndex() {
      try {
        const response = await fetch('campaigns-index.json?t=' + Date.now());
        if (!response.ok) throw new Error('Index file not found');
        const data = await response.json();
        const campaigns = data.campaigns || [];
        updateSidebarCampaigns(campaigns);
        renderCampaignCards(campaigns);
      } catch (err) {
        document.getElementById('hub-cards').innerHTML = `
          <div class="hub-card-empty">
            <p>No campaigns found.</p>
            <p>Run /marketing sustain list to refresh, or create a new campaign.</p>
          </div>
        `;
      }
    }

    function renderCampaignCards(campaigns) {
      if (campaigns.length === 0) {
        document.getElementById('hub-cards').innerHTML = `
          <div class="hub-card-empty">
            <p>No campaigns found.</p>
            <p>Run /marketing sustain list to refresh, or create a new campaign.</p>
          </div>
        `;
        return;
      }

      document.getElementById('hub-cards').innerHTML = campaigns.map(c => {
        const progress = Math.round((c.current_batch / c.total_batches) * 100);
        return `
          <div class="hub-card">
            <div class="hub-card-header">
              <span class="hub-card-name">${escapeHtml(c.brief)}</span>
              <span class="hub-card-status ${c.status}">${c.status}</span>
            </div>
            <div class="hub-card-meta">
              <span>${c.cadence}</span>
              <span>&middot;</span>
              <span>${(c.content_types || []).join(', ')}</span>
            </div>
            <div class="hub-card-progress">
              <div class="hub-card-bar-wrap"><div class="hub-card-bar-fill" style="width:${progress}%"></div></div>
              <span class="hub-card-pct">${progress}%</span>
              <span class="hub-card-batch">Batch ${c.current_batch}/${c.total_batches}</span>
            </div>
            <div class="hub-card-footer">
              <span>Next: ${c.next_run || 'Scheduled'}</span>
              <span class="hub-card-last-result ${c.last_run_status}">${c.last_run_status || 'Pending'}</span>
            </div>
            <div class="hub-card-actions">
              <button class="hub-action-btn" onclick="switchView('monitor', '${c.dir}')">View</button>
              <button class="hub-action-btn run" onclick="showToast('Run Batch', '/marketing sustain run ${c.slug}')">Run Now</button>
              <button class="hub-action-btn" onclick="showToast('Pause Campaign', '/marketing sustain pause ${c.slug}')">Pause</button>
              <button class="hub-action-btn danger" onclick="showToast('Delete Campaign', '/marketing sustain delete ${c.slug}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===================== WIZARD VIEW =====================
    function renderWizardView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'wizard';
      wizardState = { step: 1, brief: '', contentTypes: ['blog-post', 'social-media'], platforms: ['twitter'], cadence: 'weekly', day: 1, hour: 9, totalBatches: 12 };

      dashboard.innerHTML = renderWizardContent();
      setActiveTab('wizard');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
      updateWizardStep();
    }

    function renderWizardContent() {
      return `
        <div class="wizard-view">
          <div class="wizard-header">
            <span class="wizard-title">Create Campaign</span>
            <p class="wizard-subtitle">Step-by-step guided setup for your sustained campaign</p>
          </div>
          <div class="wizard-steps">
            <div class="wizard-step" id="step-1-indicator"></div>
            <div class="wizard-step" id="step-2-indicator"></div>
            <div class="wizard-step" id="step-3-indicator"></div>
            <div class="wizard-step" id="step-4-indicator"></div>
          </div>
          <div class="wizard-content" id="wizard-step-content"></div>
        </div>
      `;
    }

    function updateWizardStep() {
      const step = wizardState.step;
      for (let i = 1; i <= 4; i++) {
        const indicator = document.getElementById('step-' + i + '-indicator');
        if (i < step) indicator.className = 'wizard-step done';
        else if (i === step) indicator.className = 'wizard-step active';
        else indicator.className = 'wizard-step';
      }
      const content = document.getElementById('wizard-step-content');
      switch (step) {
        case 1: content.innerHTML = renderStep1(); break;
        case 2: content.innerHTML = renderStep2(); break;
        case 3: content.innerHTML = renderStep3(); break;
        case 4: content.innerHTML = renderStep4(); break;
      }
    }

    function renderStep1() {
      return `
        <div class="wizard-step-title">Campaign Brief</div>
        <div class="wizard-label">Campaign Description</div>
        <textarea class="wizard-textarea" id="wizard-brief" placeholder="e.g., Weekly content marketing for our AI SaaS product launch targeting enterprise CTOs">${wizardState.brief}</textarea>
        <p class="wizard-hint">Describe what this campaign should accomplish. Be specific about your audience and goals.</p>
        <div class="wizard-nav">
          <span></span>
          <button class="wizard-btn wizard-btn-next" onclick="wizardNext()">Continue</button>
        </div>
      `;
    }

    function renderStep2() {
      return `
        <div class="wizard-step-title">Content Strategy</div>
        <div class="wizard-label">Content Types</div>
        <div class="wizard-checkbox-group">
          <label class="wizard-checkbox-label">
            <div class="wizard-checkbox ${wizardState.contentTypes.includes('blog-post') ? 'checked' : ''}" onclick="toggleContentType('blog-post')"></div>
            Blog Posts
          </label>
          <label class="wizard-checkbox-label">
            <div class="wizard-checkbox ${wizardState.contentTypes.includes('social-media') ? 'checked' : ''}" onclick="toggleContentType('social-media')"></div>
            Social Media
          </label>
          <label class="wizard-checkbox-label">
            <div class="wizard-checkbox ${wizardState.contentTypes.includes('email') ? 'checked' : ''}" onclick="toggleContentType('email')"></div>
            Email Campaigns
          </label>
        </div>
        ${wizardState.contentTypes.includes('social-media') ? `
          <div class="wizard-label" style="margin-top:16px">Social Platforms</div>
          <div class="wizard-checkbox-group">
            <label class="wizard-checkbox-label"><div class="wizard-checkbox ${wizardState.platforms.includes('twitter') ? 'checked' : ''}" onclick="togglePlatform('twitter')"></div> Twitter/X</label>
            <label class="wizard-checkbox-label"><div class="wizard-checkbox ${wizardState.platforms.includes('reddit') ? 'checked' : ''}" onclick="togglePlatform('reddit')"></div> Reddit</label>
            <label class="wizard-checkbox-label"><div class="wizard-checkbox ${wizardState.platforms.includes('telegram') ? 'checked' : ''}" onclick="togglePlatform('telegram')"></div> Telegram</label>
            <label class="wizard-checkbox-label"><div class="wizard-checkbox ${wizardState.platforms.includes('linkedin') ? 'checked' : ''}" onclick="togglePlatform('linkedin')"></div> LinkedIn</label>
          </div>
        ` : ''}
        <div class="wizard-nav">
          <button class="wizard-btn wizard-btn-back" onclick="wizardBack()">Back</button>
          <button class="wizard-btn wizard-btn-next" onclick="wizardNext()">Continue</button>
        </div>
      `;
    }

    function renderStep3() {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const cadences = ['Daily', 'Weekly', 'Bi-Weekly', 'Monthly'];
      const durationHint = { 'daily': `${wizardState.totalBatches} batches daily = ${wizardState.totalBatches} days`, 'weekly': `${wizardState.totalBatches} batches weekly = ~${Math.round(wizardState.totalBatches / 4)} months`, 'bi-weekly': `${wizardState.totalBatches} batches bi-weekly = ~${Math.round(wizardState.totalBatches / 2)} weeks`, 'monthly': `${wizardState.totalBatches} batches monthly = ${wizardState.totalBatches} months` }[wizardState.cadence];
      return `
        <div class="wizard-step-title">Schedule</div>
        <div class="wizard-label">Cadence</div>
        <div class="wizard-radio-group">
          ${cadences.map(c => `<button class="wizard-radio ${wizardState.cadence === c.toLowerCase() ? 'active' : ''}" onclick="setCadence('${c.toLowerCase()}')">${c}</button>`).join('')}
        </div>
        ${wizardState.cadence !== 'daily' ? `
          <div class="wizard-label">Day of Week</div>
          <div class="wizard-day-buttons">
            ${days.map((d, i) => `<button class="wizard-day-btn ${wizardState.day === i ? 'active' : ''}" onclick="setDay(${i})">${d}</button>`).join('')}
          </div>
        ` : ''}
        <div class="wizard-label">Run Time (Hour)</div>
        <select class="wizard-input" id="wizard-hour" onchange="setHour(this.value)">
          ${Array.from({length: 24}, (_, i) => `<option value="${i}" ${wizardState.hour === i ? 'selected' : ''}>${i.toString().padStart(2, '0')}:00</option>`).join('')}
        </select>
        <div class="wizard-label" style="margin-top:16px">Total Batches</div>
        <input type="number" class="wizard-input" id="wizard-batches" value="${wizardState.totalBatches}" min="1" max="52" onchange="setTotalBatches(this.value)">
        <p class="wizard-hint">${durationHint}</p>
        <div class="wizard-nav">
          <button class="wizard-btn wizard-btn-back" onclick="wizardBack()">Back</button>
          <button class="wizard-btn wizard-btn-next" onclick="wizardNext()">Continue</button>
        </div>
      `;
    }

    function renderStep4() {
      const command = generateWizardCommand();
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return `
        <div class="wizard-step-title">Review & Launch</div>
        <div class="wizard-command-box">
          <div class="wizard-label">Campaign Command</div>
          <div class="wizard-command">${escapeHtml(command)}</div>
        </div>
        <div class="wizard-label">Summary</div>
        <div style="background:var(--background-secondary);padding:14px;border:1px solid var(--background-modifier-border);border-radius:var(--radius-s);margin-bottom:16px;font-size:13px;">
          <div style="margin-bottom:6px;"><strong>Brief:</strong> ${wizardState.brief || 'Not set'}</div>
          <div style="margin-bottom:6px;"><strong>Content Types:</strong> ${wizardState.contentTypes.join(', ')}</div>
          <div style="margin-bottom:6px;"><strong>Cadence:</strong> ${wizardState.cadence}</div>
          ${wizardState.cadence !== 'daily' ? `<div style="margin-bottom:6px;"><strong>Day:</strong> ${days[wizardState.day]}</div>` : ''}
          <div style="margin-bottom:6px;"><strong>Time:</strong> ${wizardState.hour.toString().padStart(2, '0')}:00</div>
          <div><strong>Total Batches:</strong> ${wizardState.totalBatches}</div>
        </div>
        <button class="wizard-copy-btn" id="wizard-copy-btn" onclick="copyWizardCommand()">Copy & Launch</button>
        <div class="wizard-nav">
          <button class="wizard-btn wizard-btn-back" onclick="wizardBack()">Back</button>
          <span></span>
        </div>
      `;
    }

    function generateWizardCommand() {
      return `/marketing sustain create "${wizardState.brief}" --cadence ${wizardState.cadence} --batches ${wizardState.totalBatches} --day ${wizardState.day} --hour ${wizardState.hour} --types ${wizardState.contentTypes.join(',')}`;
    }

    function wizardNext() {
      if (wizardState.step === 1) { const brief = document.getElementById('wizard-brief').value; if (!brief.trim()) { alert('Please enter a campaign brief'); return; } wizardState.brief = brief; }
      if (wizardState.step === 2 && wizardState.contentTypes.length === 0) { alert('Please select at least one content type'); return; }
      if (wizardState.step < 4) { wizardState.step++; updateWizardStep(); }
    }
    function wizardBack() { if (wizardState.step > 1) { wizardState.step--; updateWizardStep(); } }
    function toggleContentType(type) { const idx = wizardState.contentTypes.indexOf(type); if (idx > -1) wizardState.contentTypes.splice(idx, 1); else wizardState.contentTypes.push(type); updateWizardStep(); }
    function togglePlatform(platform) { const idx = wizardState.platforms.indexOf(platform); if (idx > -1) wizardState.platforms.splice(idx, 1); else wizardState.platforms.push(platform); updateWizardStep(); }
    function setCadence(cadence) { wizardState.cadence = cadence; updateWizardStep(); }
    function setDay(day) { wizardState.day = day; updateWizardStep(); }
    function setHour(hour) { wizardState.hour = parseInt(hour); }
    function setTotalBatches(batches) { wizardState.totalBatches = Math.min(52, Math.max(1, parseInt(batches) || 12)); }

    function copyWizardCommand() {
      navigator.clipboard.writeText(generateWizardCommand()).then(() => {
        const btn = document.getElementById('wizard-copy-btn');
        btn.textContent = 'Copied! Paste in Claude Code';
        btn.classList.add('wizard-copied');
        setTimeout(() => { btn.textContent = 'Copy & Launch'; btn.classList.remove('wizard-copied'); }, 3000);
      });
    }

    // ===================== CALENDAR VIEW =====================
    async function renderCalendarView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'calendar';
      dashboard.innerHTML = `
        <div class="calendar-view">
          <div class="calendar-funnel-bar" id="calendar-funnel"></div>
          <div class="calendar-grid" id="calendar-grid">Loading calendar...</div>
        </div>
      `;
      setActiveTab('calendar');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
      await loadCalendar();
    }

    async function loadCalendar() {
      try {
        const response = await fetch((currentCampaign || '.') + '/content-calendar.json?t=' + Date.now());
        if (!response.ok) throw new Error('Calendar not found');
        const calendar = await response.json();
        calendarData = calendar;
        renderFunnelBar(calendar);
        renderCalendarGrid(calendar);
      } catch (err) {
        document.getElementById('calendar-grid').innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-faint)">Calendar not found. Run /marketing sustain calendar ${getCampaignSlug(currentCampaign)} to generate.</div>`;
      }
    }

    function renderFunnelBar(calendar) {
      const counts = { awareness: 0, consideration: 0, decision: 0, retention: 0 };
      calendar.forEach(e => { if (e.funnel_stage && counts[e.funnel_stage] !== undefined) counts[e.funnel_stage]++; });
      document.getElementById('calendar-funnel').innerHTML = `
        <div class="calendar-funnel-segment awareness">Awareness (${counts.awareness})</div>
        <div class="calendar-funnel-segment consideration">Consideration (${counts.consideration})</div>
        <div class="calendar-funnel-segment decision">Decision (${counts.decision})</div>
        <div class="calendar-funnel-segment retention">Retention (${counts.retention})</div>
      `;
    }

    function renderCalendarGrid(calendar) {
      document.getElementById('calendar-grid').innerHTML = calendar.map((entry, i) => {
        const status = entry.status || 'pending';
        return `
          <div class="calendar-card ${status}" onclick="openBatchDetail(${i})">
            <div class="calendar-card-tags">
              <span class="calendar-tag funnel-${entry.funnel_stage}">${entry.funnel_stage || 'Unknown'}</span>
              <span class="calendar-tag pillar">${entry.content_pillar || 'General'}</span>
            </div>
            <div class="calendar-card-header">
              <span class="calendar-card-batch">Batch ${(entry.batch_number || i + 1).toString().padStart(3, '0')}</span>
              <span class="calendar-card-status ${status}"></span>
            </div>
            <div class="calendar-card-theme">${escapeHtml(entry.theme || 'No theme')}</div>
            <div class="calendar-card-date">${entry.scheduled_date || 'Not scheduled'}</div>
            <div class="calendar-card-expand">Click to view details</div>
          </div>
        `;
      }).join('');
    }

    // ===================== BATCH DETAIL PANEL =====================
    let calendarData = [];

    function openBatchDetail(index) {
      const entry = (calendarData || [])[index];
      if (!entry) return;
      document.getElementById('detail-title').textContent = `Batch ${(entry.batch_number || index + 1).toString().padStart(3, '0')}: ${entry.theme || 'No theme'}`;
      document.getElementById('detail-content').innerHTML = `
        <div class="batch-detail-section">
          <div class="batch-detail-section-title">Batch Information</div>
          <div class="batch-detail-grid">
            <div class="batch-detail-item"><div class="batch-detail-label">Scheduled Date</div><div class="batch-detail-value">${entry.scheduled_date || 'Not set'}</div></div>
            <div class="batch-detail-item"><div class="batch-detail-label">Status</div><div class="batch-detail-value">${entry.status || 'Pending'}</div></div>
            <div class="batch-detail-item"><div class="batch-detail-label">Funnel Stage</div><div class="batch-detail-value">${entry.funnel_stage || 'Unknown'}</div></div>
            <div class="batch-detail-item"><div class="batch-detail-label">Content Pillar</div><div class="batch-detail-value">${entry.content_pillar || 'General'}</div></div>
          </div>
        </div>
        <div class="batch-detail-section">
          <div class="batch-detail-section-title">Content Types</div>
          ${(entry.content_types || []).map(ct => `
            <div class="batch-detail-content-card">
              <div class="batch-detail-content-type">${ct.type || 'Content'}</div>
              ${ct.angle ? `<div class="batch-detail-content-detail"><strong>Angle:</strong> ${escapeHtml(ct.angle)}</div>` : ''}
              ${ct.keywords ? `<div class="batch-detail-content-detail"><strong>Keywords:</strong> ${escapeHtml(ct.keywords)}</div>` : ''}
              ${ct.hook ? `<div class="batch-detail-content-detail"><strong>Hook:</strong> ${escapeHtml(ct.hook)}</div>` : ''}
              ${ct.subject_line ? `<div class="batch-detail-content-detail"><strong>Subject:</strong> ${escapeHtml(ct.subject_line)}</div>` : ''}
              ${ct.cta ? `<div class="batch-detail-content-detail"><strong>CTA:</strong> ${escapeHtml(ct.cta)}</div>` : ''}
              ${ct.platforms ? `<div class="batch-detail-content-detail"><strong>Platforms:</strong> ${escapeHtml(ct.platforms)}</div>` : ''}
            </div>
          `).join('')}
        </div>
        <div class="batch-detail-section">
          <div class="batch-detail-section-title">Deliverables</div>
          ${(entry.deliverables || []).map(d => `
            <div class="batch-detail-item" style="margin-bottom:8px;">
              <div class="batch-detail-label">${d.type || 'File'}</div>
              <div class="batch-detail-value">${escapeHtml(d.path || d.description || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('batch-detail-panel').classList.add('open');
      document.getElementById('batch-detail-overlay').classList.add('open');
    }

    function closeBatchDetail() {
      document.getElementById('batch-detail-panel').classList.remove('open');
      document.getElementById('batch-detail-overlay').classList.remove('open');
    }

    // ===================== HISTORY VIEW =====================
    async function renderHistoryView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'history';
      dashboard.innerHTML = `
        <div class="history-view">
          <table class="history-table">
            <thead><tr><th>Batch</th><th>Date</th><th>Duration</th><th>Status</th></tr></thead>
            <tbody id="history-rows"><tr><td colspan="4" style="text-align:center;color:var(--text-faint)">Loading history...</td></tr></tbody>
          </table>
        </div>
      `;
      setActiveTab('history');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
      await loadHistory();
    }

    async function loadHistory() {
      try {
        const response = await fetch((currentCampaign || '.') + '/batch-history.json?t=' + Date.now());
        if (!response.ok) throw new Error('History not found');
        const history = await response.json();
        calendarData = history;
        renderHistoryRows(history);
      } catch (err) {
        document.getElementById('history-rows').innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--text-faint)">No history found. Run batches to see execution history.</td></tr>`;
      }
    }

    function renderHistoryRows(history) {
      document.getElementById('history-rows').innerHTML = history.map((entry, i) => `
        <tr onclick="openBatchDetail(${i})">
          <td>Batch ${(entry.batch_number || i + 1).toString().padStart(3, '0')}</td>
          <td>${entry.run_at || entry.timestamp || '-'}</td>
          <td>${entry.duration_sec ? formatDuration(entry.duration_sec) : '-'}</td>
          <td><span class="history-status ${entry.status || 'pending'}">${entry.status || 'Pending'}</span></td>
        </tr>
      `).join('');
    }

    function formatDuration(seconds) { if (!seconds) return '-'; const mins = Math.floor(seconds / 60); const secs = seconds % 60; return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`; }

    // ===================== MONITOR VIEW =====================
    async function renderMonitorView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'monitor';
      dashboard.innerHTML = `
        <div class="sustain-panel-view">
          <div class="sustain-header"><span class="sustain-title">Campaign Monitor</span></div>
          <div class="sustain-sections">
            <div class="sustain-section"><div class="sustain-section-title">Campaign Status</div><div class="sustain-status" id="sustain-status">Loading...</div></div>
            <div class="sustain-section"><div class="sustain-section-title">Progress</div><div class="sustain-progress" id="sustain-progress">Loading...</div></div>
            <div class="sustain-section"><div class="sustain-section-title">Next Run</div><div class="sustain-next-run" id="sustain-next-run">Loading...</div></div>
          </div>
        </div>
      `;
      setActiveTab('monitor');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
      await loadMonitorData();
    }

    async function loadMonitorData() {
      try {
        const config = await fetchJson(currentCampaign + '/campaign-config.json');
        const state = await fetchJson(currentCampaign + '/campaign-state.json');
        const calendar = await fetchJson(currentCampaign + '/content-calendar.json');
        document.getElementById('sustain-status').textContent = state.status || 'Unknown';
        document.getElementById('sustain-progress').textContent = `Batch ${state.current_batch || 0} of ${config.total_batches || 0}`;
        const nextEntry = calendar.find(e => e.status === 'pending');
        document.getElementById('sustain-next-run').textContent = nextEntry?.scheduled_date || 'All batches complete';
      } catch (err) {
        document.getElementById('sustain-status').textContent = 'Error loading data';
      }
    }

    // ===================== ONE SHOT VIEW =====================
    function renderOneShotView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'one-shot';
      dashboard.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <h2 style="color:var(--text-normal);font-size:20px;margin-bottom:12px;font-weight:600;">Marketing Pipeline</h2>
          <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">
            One-shot pipeline mode. Start a pipeline with <code style="background:var(--background-secondary);padding:2px 8px;border-radius:var(--radius-s);font-family:var(--font-mono);font-size:12px;">/marketing campaign</code>
          </p>
          <button class="hub-create-btn" onclick="switchView('hub')">View Sustained Campaigns</button>
        </div>
      `;
      setActiveTab('hub');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
    }

    // ===================== CLOUD VIEW =====================
    function renderCloudView(params) {
      const dashboard = document.getElementById('dashboard');
      currentView = 'cloud';
      dashboard.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <h2 style="color:var(--text-normal);font-size:20px;margin-bottom:12px;font-weight:600;">Cloud Campaign</h2>
          <p style="color:var(--text-muted);font-size:14px;">Campaign ID: ${params.campaign_id || 'Unknown'}</p>
        </div>
      `;
    }

    // ===================== COMMAND TOAST =====================
    let toastCommand = '';
    function showToast(title, command) {
      toastCommand = command;
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-command').textContent = command;
      document.getElementById('command-toast').classList.add('show');
      const btn = document.getElementById('toast-btn');
      btn.textContent = 'Copy';
      btn.classList.remove('command-toast-copied');
    }
    function hideToast() { document.getElementById('command-toast').classList.remove('show'); }
    function copyCommand() {
      if (toastCommand) {
        navigator.clipboard.writeText(toastCommand).then(() => {
          const btn = document.getElementById('toast-btn');
          btn.textContent = 'Copied!';
          btn.classList.add('command-toast-copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('command-toast-copied'); hideToast(); }, 2000);
        });
      }
    }

    // ===================== UTILITIES =====================
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    async function fetchJson(url) { const response = await fetch(url + '?t=' + Date.now()); if (!response.ok) throw new Error('Failed to fetch: ' + url); return response.json(); }

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', initViewRouter);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeBatchDetail(); hideToast(); } });
  </script>
</body>
</html>
