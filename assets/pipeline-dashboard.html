    // ===================== HISTORY VIEW =====================
    let historyFilter = 'all';
    let historyCampaigns = [];

    async function renderHistoryView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'history';
      // Load campaigns for filter
      try {
        if (window.isCloudMode) {
          const cloudCampaigns = await cloudAPI.listCampaigns();
          historyCampaigns = cloudCampaigns.map(c => ({
            name: c.name, slug: c.slug, mode: c.mode,
            status: c.status === 'done' ? 'complete' : c.status,
            date: (c.created_at || '').split('T')[0],
            deliverableCount: 0
          }));
        } else {
          const r = await fetch('storage-index.json?t=' + Date.now());
          if (r.ok) { const d = await r.json(); historyCampaigns = d.campaigns || []; }
        }
      } catch (e) {}

      const counts = { all: historyCampaigns.length, pending: 0, active: 0, complete: 0 };
      historyCampaigns.forEach(c => { const s = (c.status || '').toLowerCase(); if (s === 'complete' || s === 'completed') counts.complete++; else if (s === 'active' || s === 'running') counts.active++; else counts.pending++; });

      dashboard.innerHTML = `
        <div class="history-view" style="padding:20px">
          <div style="font-size:20px;font-weight:700;color:var(--text-normal);margin-bottom:16px">History</div>
          <div class="history-filters">
            <button class="history-filter-tab ${historyFilter === 'all' ? 'active' : ''}" onclick="filterHistory('all')">All (${counts.all})</button>
            <button class="history-filter-tab ${historyFilter === 'pending' ? 'active' : ''}" onclick="filterHistory('pending')">Pending (${counts.pending})</button>
            <button class="history-filter-tab ${historyFilter === 'active' ? 'active' : ''}" onclick="filterHistory('active')">Active (${counts.active})</button>
            <button class="history-filter-tab ${historyFilter === 'complete' ? 'active' : ''}" onclick="filterHistory('complete')">Completed (${counts.complete})</button>
          </div>
          <div class="history-campaigns" id="history-campaigns"></div>
          <div style="font-size:14px;font-weight:600;color:var(--text-normal);margin:20px 0 12px">Batch Execution Log</div>
          <table class="history-table">
            <thead><tr><th>Batch</th><th>Date</th><th>Duration</th><th>Status</th></tr></thead>
            <tbody id="history-rows"><tr><td colspan="4" style="text-align:center;color:var(--text-faint)">Loading...</td></tr></tbody>
          </table>
        </div>
      `;
      setActiveTab('history');
      document.getElementById('status-refresh').textContent = '';
      document.getElementById('status-dot').style.display = 'none';
      renderHistoryCampaigns();
      await loadHistory();
    }

    function filterHistory(filter) {
      historyFilter = filter;
      document.querySelectorAll('.history-filter-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.history-filter-tab[onclick*="' + filter + '"]').classList.add('active');
      renderHistoryCampaigns();
    }

    function renderHistoryCampaigns() {
      const container = document.getElementById('history-campaigns');
      let filtered = historyCampaigns;
      if (historyFilter !== 'all') {
        filtered = historyCampaigns.filter(c => {
          const s = (c.status || '').toLowerCase();
          if (historyFilter === 'complete') return s === 'complete' || s === 'completed';
          if (historyFilter === 'active') return s === 'active' || s === 'running';
          return s !== 'complete' && s !== 'completed' && s !== 'active' && s !== 'running';
        });
      }
      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-faint)">No campaigns match this filter.</div>';
        return;
      }
      container.innerHTML = filtered.map(c => {
        const statusClass = (c.status || '').toLowerCase().replace('completed', 'complete');
        return '<div class="history-campaign-card">' +
          '<div class="history-campaign-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="history-campaign-meta">' +
            '<span class="staging-review-badge ' + statusClass + '">' + (c.status || 'pending') + '</span>' +
            '<span>' + c.mode + '</span>' +
            '<span>' + c.date + '</span>' +
            '<span>' + c.deliverableCount + ' deliverables</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function loadHistory() {
      try {
        if (window.isCloudMode) {
          throw new Error('Batch history is only available for local sustained campaigns.');
        }
        const response = await fetch((currentCampaign || '.') + '/batch-history.json?t=' + Date.now());
        if (!response.ok) throw new Error('History not found');
        const history = await response.json();
        const entries = Array.isArray(history) ? history : (history.batches || []);
        calEntries = entries;
        renderHistoryRows(entries);
      } catch (err) {
        document.getElementById('history-rows').innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--text-faint)">No history found. Run batches to see execution history.</td></tr>`;
      }
    }

    function renderHistoryRows(history) {
      document.getElementById('history-rows').innerHTML = history.map((entry, i) => `
        <tr onclick="openBatchDetail(${i})">
          <td>Batch ${(entry.batch || entry.batch_number || i + 1).toString().padStart(3, '0')}</td>
          <td>${entry.started_at || entry.run_at || entry.timestamp || '-'}</td>
          <td>${entry.duration_sec ? formatDuration(entry.duration_sec) : '-'}</td>
          <td><span class="history-status ${entry.status || 'pending'}">${entry.status || 'Pending'}</span></td>
        </tr>
      `).join('');
    }

    function formatDuration(seconds) { if (!seconds) return '-'; const mins = Math.floor(seconds / 60); const secs = seconds % 60; return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`; }

    // ===================== MONITOR VIEW =====================
    const PIPELINE_STAGES = [
      { id: 'setup', name: 'Setup', icon: '\u2699' },
      { id: 'research', name: 'Research', icon: '\uD83D\uDD0D' },
      { id: 'strategy', name: 'Strategy', icon: '\uD83C\uDFAF' },
      { id: 'content', name: 'Content + SEO + Media', icon: '\u270D' },
      { id: 'review', name: 'Review', icon: '\u2714' },
      { id: 'final', name: 'Final Report', icon: '\uD83D\uDCCB' },
      { id: 'approval', name: 'Content Approval', icon: '\u23F3' },
      { id: 'distribution', name: 'Distribution', icon: '\uD83D\uDE80' }
    ];

    let monitorPollTimer = null;

    async function renderMonitorView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'monitor';
      dashboard.innerHTML = '<div class="monitor-view"><select class="review-campaign-select" id="monitor-campaign-select" onchange="switchMonitorCampaign(this.value)" style="margin-bottom:16px"></select><div id="monitor-container"><div class="monitor-empty"><h3>Loading pipeline data...</h3></div></div></div>';
      setActiveTab('monitor');
      // Load campaign list for selector
      let monitorCampaignList = [];
      try {
        if (window.isCloudMode) {
          monitorCampaignList = await cloudAPI.listCampaigns();
          monitorCampaignList = monitorCampaignList.map(c => ({ id: c.id, name: c.name || c.slug, dir: c.id }));
        } else {
          const r = await fetch('storage-index.json?t=' + Date.now());
          if (r.ok) {
            const data = await r.json();
            monitorCampaignList = (data.campaigns || []).map(c => ({ id: c.outputDir, name: c.name, dir: c.outputDir }));
          }
        }
        } catch (e) {}
      // Populate campaign selector
      const select = document.getElementById('monitor-campaign-select');
      if (select && monitorCampaignList.length > 0) {
        if (!currentCampaign) currentCampaign = monitorCampaignList[0].dir;
        select.innerHTML = monitorCampaignList.map(c =>
          '<option value="' + escapeHtml(c.dir) + '"' + (currentCampaign === c.dir ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>'
        ).join('');
      } else if (select) {
        select.innerHTML = '<option>No campaigns found</option>';
      }
      await loadMonitorData();
      // Auto-refresh every 5s
      if (monitorPollTimer) clearInterval(monitorPollTimer);
      monitorPollTimer = setInterval(loadMonitorData, 5000);
      document.getElementById('status-refresh').textContent = 'Auto-refresh: 5s';
      document.getElementById('status-dot').style.display = '';
    }

    function switchMonitorCampaign(dir) {
      currentCampaign = dir;
      if (monitorPollTimer) clearInterval(monitorPollTimer);
      loadMonitorData();
      monitorPollTimer = setInterval(loadMonitorData, 5000);
    }

    async function loadMonitorData() {
      const container = document.getElementById('monitor-container');
      if (!container || currentView !== 'monitor') { if (monitorPollTimer) clearInterval(monitorPollTimer); return; }

      let pipelineData = null;
      let campaignName = '';
      let campaignStatus = 'pending';

      try {
        if (window.isCloudMode && currentCampaign) {
          const campaign = await cloudAPI.getCampaign(currentCampaign);
          if (campaign) {
            pipelineData = campaign.pipeline_status || {};
            campaignName = campaign.name || campaign.slug || '';
            campaignStatus = campaign.status || 'pending';
            pipelineData.status = pipelineData.status || campaignStatus;
            pipelineData.campaign = pipelineData.campaign || campaignName;
          }
        } else if (currentCampaign) {
          // Convert absolute paths to relative URLs via the marketing-output symlink
          let basePath = currentCampaign;
          if (basePath.includes('/marketing-output/')) {
            basePath = 'marketing-output/' + basePath.split('/marketing-output/')[1];
          } else if (basePath.includes('/.marketing-pipeline/')) {
            basePath = basePath; // keep as-is for local campaign dirs
          }
          try { pipelineData = await fetchJson(basePath + '/pipeline-status.json'); } catch (e) {}
          if (!pipelineData) {
            try {
              const config = await fetchJson(basePath + '/campaign-config.json');
              const state = await fetchJson(basePath + '/campaign-state.json');
              pipelineData = {
                campaign: config.brief || config.slug || 'Campaign',
                status: state.status || 'pending',
                progress: { current: state.current_batch || 0, total: config.total_batches || 1 },
                stages: [], deliverables: [], activities: []
              };
            } catch (e2) {}
          }
        }
      } catch (e) {}

      if (!pipelineData) {
        container.innerHTML = '<div class="monitor-empty"><h3>No campaign selected</h3><p style="color:var(--text-faint)">Select a campaign from the sidebar or Hub to monitor its progress.</p></div>';
        return;
      }

      const status = (pipelineData.status || 'pending').toLowerCase();
      const stages = pipelineData.stages || [];
      const progress = pipelineData.progress || { current: 0, total: PIPELINE_STAGES.length };
      const pct = progress.total > 0 ? Math.round((progress.current / progress.total) * 100) : 0;
      const deliverables = pipelineData.deliverables || [];
      const activities = pipelineData.activities || [];
      const doneDeliverables = deliverables.filter(d => d.status === 'done').length;
      const totalAgents = stages.reduce((sum, s) => sum + (s.agents || []).length, 0);
      const activeAgents = stages.reduce((sum, s) => sum + (s.agents || []).filter(a => a.status === 'running').length, 0);

      container.innerHTML = '<div class="monitor-view">' +
        '<div class="monitor-header">' +
          '<div class="monitor-title">' + escapeHtml(pipelineData.campaign || 'Campaign Monitor') + '</div>' +
          '<span class="monitor-status-badge ' + status + '">' + status.replace('_', ' ') + '</span>' +
        '</div>' +
        '<div class="monitor-stats">' +
          '<div class="monitor-stat"><div class="monitor-stat-value">' + pct + '%</div><div class="monitor-stat-label">Progress</div></div>' +
          '<div class="monitor-stat"><div class="monitor-stat-value">' + progress.current + '/' + progress.total + '</div><div class="monitor-stat-label">Stages</div></div>' +
          '<div class="monitor-stat"><div class="monitor-stat-value">' + (activeAgents > 0 ? '<span style="animation:pulse-accent 1.5s infinite">' + activeAgents + '</span>' : '0') + '/' + totalAgents + '</div><div class="monitor-stat-label">Agents</div></div>' +
          '<div class="monitor-stat"><div class="monitor-stat-value">' + doneDeliverables + '/' + deliverables.length + '</div><div class="monitor-stat-label">Deliverables</div></div>' +
        '</div>' +
        '<div class="monitor-progress-section">' +
          '<div class="monitor-progress-bar"><div class="monitor-progress-fill ' + (pct >= 100 ? 'complete' : '') + '" style="width:' + pct + '%"></div></div>' +
          '<div class="monitor-progress-text"><span>Stage ' + progress.current + ' of ' + progress.total + '</span><span>' + pct + '% complete</span></div>' +
        '</div>' +
        '<div class="monitor-stages">' +
          renderMonitorStages(stages) +
        '</div>' +
        (activities.length > 0 ? '<div class="monitor-activity"><div class="monitor-activity-title">Activity Log</div><div class="monitor-log">' + activities.slice(-20).reverse().map(a => '<div class="monitor-log-entry ' + (a.level || '') + '"><span class="log-time">' + (a.time || '') + '</span>' + escapeHtml(a.message || '') + '</div>').join('') + '</div></div>' : '') +
      '</div>';
    }

    function renderMonitorStages(stages) {
      if (stages.length === 0) {
        return PIPELINE_STAGES.map((s, i) => {
          return '<div class="monitor-stage">' +
            '<div class="monitor-stage-icon">' + s.icon + '</div>' +
            '<div class="monitor-stage-name">' + s.name + '</div>' +
            '<span class="monitor-stage-status pending">Pending</span>' +
          '</div>';
        }).join('');
      }
      return stages.map(s => {
        const stageStatus = (s.status || 'pending').toLowerCase();
        const isActive = stageStatus === 'running';
        const isDone = stageStatus === 'done';
        const icon = (PIPELINE_STAGES.find(ps => ps.id === s.id) || {}).icon || '\u25CF';
        const agents = s.agents || [];
        const agentText = agents.length > 0 ? agents.map(a => a.name + ' (' + (a.status || 'pending') + ')').join(', ') : '';
        let timeText = '';
        if (s.startTime && s.endTime) {
          const dur = Math.round((new Date(s.endTime) - new Date(s.startTime)) / 1000);
          timeText = dur > 60 ? Math.floor(dur / 60) + 'm ' + (dur % 60) + 's' : dur + 's';
        } else if (s.startTime && isActive) {
          timeText = 'Running...';
        }

    async function createSettingsTeam() {
      const nameEl = document.getElementById('settings-team-name');
      const slugEl = document.getElementById('settings-team-slug');
      const name = nameEl ? nameEl.value.trim() : '';
      const slug = slugEl ? slugEl.value.trim() : '';
      if (!name) { alert('Team name is required.'); return; }
      const team = await cloudAPI.createTeam(name, slug);
      if (!team) { alert('Failed to create team.'); return; }
      settingsTeams = await cloudAPI.listTeams();
      cloudAPI.teamId = team.id;
      updateStoredCloudBootstrap({ team_id: team.id });
      settingsMembers = await cloudAPI.getTeamMembers();
      if (nameEl) nameEl.value = '';
      if (slugEl) slugEl.value = '';
      renderSettingsTeamSection();
      renderSettingsMembersSection();
      renderSettingsApiSection();
      updateCloudStatus(true);

    async function inviteSettingsMember() {
      const activeTeam = getActiveTeamMeta();
      if (!activeTeam || !cloudAPI.teamId) return;
      const emailEl = document.getElementById('settings-invite-email');
      const roleEl = document.getElementById('settings-invite-role');
      const email = emailEl ? emailEl.value.trim() : '';
      const role = roleEl ? roleEl.value : 'member';
      if (!email) { alert('Invite email is required.'); return; }
      const invite = await cloudAPI.inviteTeamMember(cloudAPI.teamId, email, role);
      if (!invite || !invite.invitation) { alert('Failed to create invitation.'); return; }
      settingsInviteResult = {
        message: `Invite created for ${email}. Share the join command or token below.`,
        command: invite.join_command || `/marketing teams join ${invite.invitation.token}`
      };
      if (emailEl) emailEl.value = '';
      renderSettingsTeamSection();
    }

    async function removeSettingsMember(userId) {
      if (!cloudAPI.teamId) return;
      if (!confirm('Remove this member from the active team?')) return;
      const ok = await cloudAPI.removeTeamMember(cloudAPI.teamId, userId);
      if (!ok) { alert('Failed to remove member.'); return; }
      settingsMembers = await cloudAPI.getTeamMembers();
      renderSettingsMembersSection();
    }

      if (!confirm('Rotate the current API key? Existing automations using the old key will stop working.')) return;

      cloudAPI.apiKey = result.api_key;
      updateStoredCloudBootstrap({ api_key: result.api_key, team_id: cloudAPI.teamId });

    function switchStagingTab(tab) {
      stagingTab = tab;
      document.querySelectorAll('.staging-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.staging-tab[onclick*="${tab}"]`).classList.add('active');
      renderStagingReviewList();
    }

    function renderStagingReviewList() {
      const list = document.getElementById('staging-review-list');
      // Merge campaign-level items into stagingItems if not already present
      stagingCampaigns.forEach(c => {
        (c.deliverables || []).forEach(d => {
          const key = d.fullPath || d.path;
          if (!stagingItems.find(s => s.key === key)) {
            stagingItems.push({ key, name: d.name, campaign: c.name, category: d.category, size: d.size, servedPath: d.servedPath, mediaType: d.mediaType, reviewStatus: 'pending' });
          }
        });
      });
      const filtered = stagingItems.filter(s => s.reviewStatus === stagingTab);
      if (filtered.length === 0) {
        const msgs = { pending: 'No content awaiting review. Use the Review tab to send content here.', approved: 'No approved content yet.', rejected: 'No rejected content.' };
        list.innerHTML = '<div class="staging-review-empty">' + (msgs[stagingTab] || 'No content.') + '</div>';
        return;
      }
      // Bulk actions
      const bulkHtml = stagingTab === 'pending' ? '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="staging-approve-btn approve" onclick="bulkStagingAction(\'approved\')">Approve All (' + filtered.length + ')</button><button class="staging-approve-btn reject" onclick="bulkStagingAction(\'rejected\')">Reject All</button></div>' : '';
      list.innerHTML = bulkHtml + filtered.map((item, i) => {
        const idx = stagingItems.indexOf(item);
        return '<div class="staging-review-card ' + item.reviewStatus + '">' +
          '<div class="staging-review-header">' +
            '<div class="staging-review-info">' +
              '<span class="staging-review-status-dot ' + item.reviewStatus + '"></span>' +
              '<div>' +
                '<div class="staging-review-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="staging-review-meta"><span class="storage-card-badge ' + item.category + '">' + item.category + '</span> \u00B7 ' + escapeHtml(item.campaign) + ' \u00B7 ' + item.size + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="staging-review-actions">' +
              (item.reviewStatus === 'pending' ? '<button class="staging-approve-btn approve" onclick="setStagingItemReview(' + idx + ',\'approved\')">Approve</button><button class="staging-approve-btn reject" onclick="setStagingItemReview(' + idx + ',\'rejected\')">Reject</button>' : '') +
              (item.reviewStatus === 'approved' ? '<button class="staging-approve-btn reject" onclick="setStagingItemReview(' + idx + ',\'rejected\')">Revoke</button>' : '') +
              (item.reviewStatus === 'rejected' ? '<button class="staging-approve-btn approve" onclick="setStagingItemReview(' + idx + ',\'approved\')">Approve</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function setStagingItemReview(idx, status) {
      const item = stagingItems[idx];
      if (window.isCloudMode && item.campaignId) {
        const fn = status === 'approved' ? cloudAPI.approveItem : cloudAPI.rejectItem;
        await fn.call(cloudAPI, item.campaignId, item.key);
      }
      item.reviewStatus = status;
      renderStagingReviewList();
      const pending = stagingItems.filter(s => s.reviewStatus === 'pending').length;
      const approved = stagingItems.filter(s => s.reviewStatus === 'approved').length;
      const rejected = stagingItems.filter(s => s.reviewStatus === 'rejected').length;
      document.querySelectorAll('.staging-tab').forEach(t => {
        if (t.textContent.includes('Pending')) t.innerHTML = 'Pending Review' + (pending > 0 ? '<span class="staging-tab-badge">' + pending + '</span>' : '');
        if (t.textContent.includes('Approved')) t.innerHTML = 'Approved' + (approved > 0 ? '<span class="staging-tab-badge">' + approved + '</span>' : '');
        if (t.textContent.includes('Rejected')) t.innerHTML = 'Rejected' + (rejected > 0 ? '<span class="staging-tab-badge">' + rejected + '</span>' : '');
      });
    }

    async function bulkStagingAction(status) {
      if (window.isCloudMode) {
        const campaignIds = new Set(stagingItems.filter(s => s.reviewStatus === stagingTab && s.campaignId).map(s => s.campaignId));
        for (const cid of campaignIds) {
          if (status === 'approved') await cloudAPI.approveAll(cid);
          else await cloudAPI.rejectAll(cid);
        }
      }
      stagingItems.forEach(s => { if (s.reviewStatus === stagingTab) s.reviewStatus = status; });
      renderStagingReviewList();
    }

    async function saveStagingConfig() {

        const driveSaved = await cloudAPI.saveStagingConfig('drive', stagingConfig.drive || {});
        const telegramSaved = await cloudAPI.saveStagingConfig('telegram', stagingConfig.telegram || {});
        if (!driveSaved || !telegramSaved) {
          alert('Failed to save staging integrations.');
          return false;
        }
        return true;
      }

      const localConfig = {
        drive: {
          ...stagingConfig.drive,
          credentials_path: stagingConfig.drive.credentials_path || stagingConfig.drive.key_path || '',
          key_path: stagingConfig.drive.credentials_path || stagingConfig.drive.key_path || ''
        },
        telegram: { ...(stagingConfig.telegram || {}) }
      };
      const configJson = JSON.stringify(localConfig, null, 2);
      copyToClipboard('echo ' + "'" + configJson + "'" + ' > ~/.marketing-pipeline/staging-config.json');
      return true;

          folder_id: folderId,
          auto_upload: document.getElementById('drive-auto-upload').checked

    async function loadBrainstormData() {
      try {
        const response = await fetch('storage-index.json?t=' + Date.now());

        const data = await response.json();
        brainstormData = data.campaigns || [];
        renderBrainstormSources();

        renderBrainstormModelCards();

        document.getElementById('brainstorm-sources').innerHTML = '<div class="brainstorm-gallery-empty">No data. Run a campaign first.</div>';

    function renderBrainstormSources() {
      const container = document.getElementById('brainstorm-sources');

      brainstormData.forEach(c => {
        const files = c.deliverables.filter(d => ['research', 'strategy', 'seo'].includes(d.category));

      });

      if (researchFiles.length === 0) {
        container.innerHTML = '<div class="brainstorm-gallery-empty">No research data found.</div>';
        return;

      container.innerHTML = researchFiles.map(({ campaign, files }) => {

      const lb = document.createElement('div');
      lb.className = 'brainstorm-lightbox';
      lb.onclick = () => lb.remove();
      lb.innerHTML = `<img src="${src}">`;
      document.body.appendChild(lb);
    }

    function submitBrainstorm() {
      const brief = (document.getElementById('brainstorm-brief') || {}).value || '';
      const types = Array.from(brainstormTypes);
      const sources = Array.from(brainstormSources);

      if (types.length === 0) { alert('Please select at least one content type to generate.'); return; }

      const provider = brainstormProviders[brainstormSelectedProvider];
      const hasImages = types.includes('images') || types.includes('videos');

      let prompt = '';
      if (sources.length > 0) {
        prompt += 'Using the following research data as context: ' + sources.join(', ') + '. ';
      }
      if (brief.trim()) {
        prompt += brief.trim() + '. ';
      }
      if (hasImages && brainstormSelectedModel) {
        prompt += 'For image generation use ' + brainstormSelectedProvider + ' model ' + brainstormSelectedModel + '. ';
      }
      prompt += 'Generate: ' + types.join(', ') + '.';

      let envPrefix = '';
      if (hasImages && provider && provider.apiKey) {
        envPrefix = 'export ' + provider.envVar + '="' + provider.apiKey + '" && ';
      }

      const command = envPrefix + `/marketing content "${prompt}"`;
      copyToClipboard(command, document.getElementById('brainstorm-gen-btn'));
    }

    // ===================== REVIEW VIEW =====================
    let reviewData = [];
    let reviewSelected = new Set();
    let reviewCampaignFilter = 'all';

    async function renderReviewView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'review';
      reviewSelected.clear();
      dashboard.innerHTML = `<div class="review-view">
        <div class="review-title">Review</div>
        <div class="review-subtitle">Preview generated content and select pieces to send for team approval.</div>
        <select class="review-campaign-select" id="review-campaign-select" onchange="reviewCampaignFilter=this.value; renderReviewCards()">
          <option value="all">All Campaigns</option>
        </select>
        <div class="review-grid" id="review-grid">Loading...</div>
      </div>`;
      setActiveTab('review');
      await loadReviewData();
    }

    async function loadReviewData() {
      try {
        const r = await fetch('storage-index.json?t=' + Date.now());
        if (!r.ok) throw new Error('Not found');
        const data = await r.json();
        reviewData = data.campaigns || [];
        const select = document.getElementById('review-campaign-select');
        reviewData.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.slug; opt.textContent = c.name;
          if (reviewCampaignFilter === c.slug) opt.selected = true;
          select.appendChild(opt);
        });
        renderReviewCards();
      } catch (e) {
        document.getElementById('review-grid').innerHTML = '<div class="review-card" style="padding:40px;text-align:center;color:var(--text-faint)">No content found. Run a campaign first.</div>';
      }
    }

    function renderReviewCards() {
      const grid = document.getElementById('review-grid');
      let items = [];
      const campaigns = reviewCampaignFilter === 'all' ? reviewData : reviewData.filter(c => c.slug === reviewCampaignFilter);
      campaigns.forEach(c => {
        c.deliverables.forEach(d => {
          items.push({ ...d, campaignName: c.name, campaignSlug: c.slug });
        });
      });
      if (items.length === 0) { grid.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-faint)">No deliverables found.</div>'; return; }
      grid.innerHTML = items.map(d => {
        const key = d.fullPath || d.path;
        const sel = reviewSelected.has(key);
        let preview = '';
        if (d.mediaType === 'image' && d.servedPath) {
          preview = '<div class="review-card-preview"><img src="' + d.servedPath + '" loading="lazy"></div>';
        } else if (d.mediaType === 'video' && d.servedPath) {
          preview = '<div class="review-card-preview"><video src="' + d.servedPath + '" preload="metadata" muted controls></video></div>';
        } else {
          preview = '<div class="review-card-preview">' + escapeHtml(d.name) + ' \u2014 ' + d.size + '</div>';
        }
        return '<div class="review-card ' + (sel ? 'selected' : '') + '" onclick="toggleReviewSelect(\'' + escapeHtml(key) + '\', this)">' + preview + '<div class="review-card-info"><div class="review-card-name">' + escapeHtml(d.name) + '</div><div class="review-card-meta"><span class="storage-card-badge ' + d.category + '">' + d.category + '</span><span class="storage-card-campaign">' + escapeHtml(d.campaignName) + '</span><span class="storage-card-size">' + d.size + '</span></div></div></div>';
      }).join('');
      updateReviewBar();
    }

    function toggleReviewSelect(key, el) {
      if (reviewSelected.has(key)) reviewSelected.delete(key); else reviewSelected.add(key);
      if (el) el.classList.toggle('selected');
      updateReviewBar();
    }

    function updateReviewBar() {
      let bar = document.getElementById('review-actions-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'review-actions-bar';
        bar.className = 'review-actions-bar';
        bar.innerHTML = '<span><strong id="review-count">0</strong> pieces selected</span><div style="display:flex;gap:8px"><button class="staging-btn secondary" onclick="reviewSelected.clear();renderReviewCards()">Clear</button><button class="staging-btn primary" onclick="sendToStaging()">Send to Staging for Approval</button></div>';
        document.body.appendChild(bar);
      }
      const count = reviewSelected.size;
      document.getElementById('review-count').textContent = count;
      bar.classList.toggle('show', count > 0);
    }

    function sendToStaging() {
      if (reviewSelected.size === 0) return;
      const items = Array.from(reviewSelected);
      // Add selected items to staging pending list
      items.forEach(key => {
        if (!stagingItems.find(s => s.key === key)) {
          const d = findDeliverableByKey(key);
          if (d) stagingItems.push({ key, name: d.name, campaign: d.campaignName, category: d.category, size: d.size, servedPath: d.servedPath, mediaType: d.mediaType, reviewStatus: 'pending' });
        }
      });
      reviewSelected.clear();
      renderReviewCards();
      copyToClipboard('Sent ' + items.length + ' pieces to Staging Area for approval');
      switchView('staging');
    }

    function findDeliverableByKey(key) {
      for (const c of reviewData) {
        for (const d of c.deliverables) {
          if ((d.fullPath || d.path) === key) return { ...d, campaignName: c.name };
        }
      }
      return null;
    }

    // ===================== STORAGE VIEW =====================
    let storageData = [];
    let storageCampaignFilter = 'all';
    let storageCategoryFilter = 'all';
    let storageSelected = new Set();

    async function renderStorageView() {
      const dashboard = document.getElementById('dashboard');
      currentView = 'storage';
      dashboard.innerHTML = `<div class="storage-view">
        <div class="storage-header"><span class="storage-title">Storage</span></div>
        <div class="storage-campaign-tabs" id="storage-campaign-tabs"></div>
        <div class="storage-category-chips" id="storage-category-chips"></div>
        <div class="storage-grid" id="storage-grid">Loading...</div>
      </div>`;
      setActiveTab('storage');
      storageSelected.clear();
      updateStorageActionsBar();
      await loadStorageIndex();
    }

    async function loadStorageIndex() {
      try {
        if (window.isCloudMode) {
          const campaigns = await cloudAPI.listCampaigns();
          storageData = [];
          for (const c of campaigns) {
            const detail = await cloudAPI.getCampaign(c.id);
            if (detail) {
              storageData.push({
                name: detail.name || c.name, slug: detail.slug || c.slug, mode: detail.mode || c.mode,
                status: detail.status || c.status, date: (detail.created_at || '').split('T')[0],
                deliverables: (detail.deliverables || []).map(d => ({
                  name: d.name, path: d.path, fullPath: d.path, size: d.size_bytes ? Math.round(d.size_bytes/1024) + ' KB' : '?',
                  category: d.path.startsWith('01-') ? 'research' : d.path.startsWith('02-') ? 'strategy' : d.path.startsWith('03-') ? 'content' : d.path.startsWith('04-') ? 'seo' : d.path.startsWith('05-') ? 'review' : 'other',
                  status: 'done', mediaType: d.mime_type && d.mime_type.startsWith('image') ? 'image' : d.mime_type && d.mime_type.startsWith('video') ? 'video' : null,
                  cloudId: d.id, campaignId: c.id
                }))
              });
            }
          }
        } else {
          const response = await fetch('storage-index.json?t=' + Date.now());
          if (!response.ok) throw new Error('Not found');
          const data = await response.json();
          storageData = data.campaigns || [];
        }
        renderStorageCampaignTabs();
        renderStorageCategoryChips();
        renderStorageCards();
      } catch (err) {
        document.getElementById('storage-grid').innerHTML = '<div class="storage-empty"><h3>No data found</h3><p>Run a marketing campaign first.</p></div>';
      }
    }

    function renderStorageCampaignTabs() {
      const tabs = document.getElementById('storage-campaign-tabs');
      const names = [{ slug: 'all', name: 'All Campaigns' }, ...storageData.map(c => ({ slug: c.slug, name: c.name }))];
      tabs.innerHTML = names.map(t =>
        `<button class="storage-campaign-tab ${storageCampaignFilter === t.slug ? 'active' : ''}" onclick="filterStorageCampaign('${t.slug}')">${escapeHtml(t.name)}</button>`
      ).join('');
    }

    function renderStorageCategoryChips() {
      const chips = document.getElementById('storage-category-chips');
      const categories = ['all', 'research', 'strategy', 'content', 'seo', 'review', 'brief', 'final'];
      chips.innerHTML = categories.map(c =>
        `<button class="storage-chip ${storageCategoryFilter === c ? 'active' : ''}" onclick="filterStorageCategory('${c}')">${c}</button>`
      ).join('');
    }

    function getFilteredDeliverables() {
      let items = [];
      const campaigns = storageCampaignFilter === 'all' ? storageData : storageData.filter(c => c.slug === storageCampaignFilter);
      campaigns.forEach(c => {
        c.deliverables.forEach(d => {
          items.push({ ...d, campaignName: c.name, campaignSlug: c.slug });
        });
      });
      if (storageCategoryFilter !== 'all') {
        items = items.filter(d => d.category === storageCategoryFilter);
      }
      return items;
    }

    function renderStorageCards() {
      const grid = document.getElementById('storage-grid');
      const items = getFilteredDeliverables();
      if (items.length === 0) {
        grid.innerHTML = `<div class="storage-empty"><h3>No deliverables found</h3><p>Try a different filter.</p></div>`;
        return;
      }
      grid.innerHTML = items.map((d, i) => {
        const key = d.fullPath || (d.campaignSlug + '/' + d.path);
        const isSelected = storageSelected.has(key);
        return `<div class="storage-card ${isSelected ? 'selected' : ''}" onclick="toggleStorageSelect('${escapeHtml(key)}', this)" title="${escapeHtml(d.fullPath || d.path)}">
          <div class="storage-card-name">${escapeHtml(d.name)}</div>
          <div class="storage-card-meta">
            <span class="storage-card-badge ${d.category}">${d.category}</span>
            <span class="storage-card-campaign">${escapeHtml(d.campaignName)}</span>
            <span class="storage-card-size">${d.size}</span>
          </div>
          <div class="storage-card-path">${escapeHtml(d.fullPath || d.path)}</div>
        </div>`;
      }).join('');
    }

    function filterStorageCampaign(slug) {
      storageCampaignFilter = slug;
      renderStorageCampaignTabs();
      renderStorageCards();
    }

    function filterStorageCategory(category) {
      storageCategoryFilter = category;
      renderStorageCategoryChips();
      renderStorageCards();
    }

    function toggleStorageSelect(key, el) {
      if (storageSelected.has(key)) { storageSelected.delete(key); } else { storageSelected.add(key); }
      if (el) el.classList.toggle('selected');
      updateStorageActionsBar();
    }

    function clearStorageSelection() {
      storageSelected.clear();
      document.querySelectorAll('.storage-card.selected').forEach(c => c.classList.remove('selected'));
      updateStorageActionsBar();
    }

    function updateStorageActionsBar() {
      const bar = document.getElementById('storage-actions-bar');
      const count = storageSelected.size;
      document.getElementById('storage-selected-count').textContent = count;
      bar.classList.toggle('show', count > 0);
    }

    function generateFromSelected() {
      if (storageSelected.size === 0) return;
      const paths = Array.from(storageSelected);
      const command = `/marketing content "Generate content using the following research data as context: ${paths.join(', ')}"`;
      copyToClipboard(command);
    }

    // ===================== CLOUD STATUS =====================
    function updateCloudStatus(connected) {
      const dot = document.getElementById('status-dot');
      const refresh = document.getElementById('status-refresh');
      if (dot) {
        dot.style.display = '';
        dot.style.background = connected ? 'var(--interactive-success)' : 'var(--text-error)';
      }
      if (refresh) {
        const team = getActiveTeamMeta();
        const teamLabel = team ? ` · ${team.name}` : '';
        refresh.textContent = connected ? 'Cloud: ' + (cloudAPI.user ? cloudAPI.user.email : 'Connected') + teamLabel : 'Cloud: Disconnected';
      }
    }

    // ===================== COPY TO CLIPBOARD =====================
    let copyNotifyTimer = null;
    function copyToClipboard(text, btnEl) {
      if (!navigator.clipboard) { prompt('Copy this command:', text); return; }
      navigator.clipboard.writeText(text).then(() => {
        const notify = document.getElementById('copy-notify');
        notify.textContent = '\u2713 Copied to clipboard \u2014 paste in Claude Code';
        notify.classList.add('show');
        if (copyNotifyTimer) clearTimeout(copyNotifyTimer);
        copyNotifyTimer = setTimeout(() => notify.classList.remove('show'), 2500);
        if (btnEl) {
          const orig = btnEl.textContent;
          btnEl.textContent = '\u2713 Copied';
          setTimeout(() => { btnEl.textContent = orig; }, 1500);
        }
      });
    }

    // ===================== UTILITIES =====================
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    async function fetchJson(url) { const response = await fetch(url + '?t=' + Date.now()); if (!response.ok) throw new Error('Failed to fetch: ' + url); return response.json(); }

    // ===================== SIDEBAR TOGGLE =====================
    function toggleSidebar() {
      const sidebar = document.getElementById('workspace-sidebar');
      if (sidebar) sidebar.classList.toggle('collapsed');
    }

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', initViewRouter);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeBatchDetail(); } });
  </script>
</body>
</html>
